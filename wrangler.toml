# Налаштування Cloudflare Pages (docs/05-hosting-domain.md, docs/07-admin.md).
name = "zbirka-mebliv"
pages_build_output_dir = "site"
compatibility_date = "2026-10-01"

# Єдине сховище: прайс, фото (ключі photo:*), пароль і сесії адмінки.
# Створено 2026-10-08 в акаунті власника (Artemrd1@gmail.com). Акаунт для команд
# wrangler задається змінною CLOUDFLARE_ACCOUNT_ID у package.json (не секрет).
[[kv_namespaces]]
binding = "CONTENT"
id = "5605719c90be4f948bb4b7ea4ae5b14f"

# Секрети (НЕ записувати сюди), задаються в панелі Cloudflare або командою
#   npx wrangler pages secret put <НАЗВА>
#   ADMIN_LOGIN, ADMIN_PASSWORD  — початковий вхід в адмінку
#   TG_BOT_TOKEN, TG_CHAT_ID     — заявки в Telegram
#   MCP_TOKEN, GCAL_SERVICE_ACCOUNT, GCAL_CALENDAR_ID — MCP-сервер календаря
#                                  (docs/10-google-calendar-mcp.md)
